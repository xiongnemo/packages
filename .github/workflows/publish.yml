name: Publish

# Rebuilds every index from the projects' GitHub Releases on each run, so there
# is no state here to go stale or to be written by two runs at once; the
# concurrency group only keeps deploys in order.
#
# A project's release job dispatches `release-published` with the tag it just
# published. The schedule is the backstop for releases that could not dispatch.

on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Collect, index and sign
    runs-on: ubuntu-latest
    # A job left to GitHub's six-hour default once hung that long in silence on
    # 2026-10-22, and the concurrency group held every later run behind it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: work/cache
          key: packages-${{ github.run_id }}
          restore-keys: packages-

      - name: Collect release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REPO: ${{ github.event.client_payload.repository }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          include=()
          if [ -n "${DISPATCH_REPO:-}" ] && [ -n "${DISPATCH_TAG:-}" ]; then
            echo "dispatched by ${DISPATCH_REPO} ${DISPATCH_TAG}"
            include=(--include "${DISPATCH_REPO}@${DISPATCH_TAG}")
          fi
          python3 scripts/collect.py projects.json work site "${include[@]}"
          python3 scripts/macports.py projects.json work site "${include[@]}"

      - name: Index and sign
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          APK_SIGNING_KEY_NAME: ${{ vars.APK_SIGNING_KEY_NAME }}
          MACPORTS_SIGNING_KEY: ${{ secrets.MACPORTS_SIGNING_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120)
          sudo apt-get "${apt_opts[@]}" update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y -q apt-utils createrepo-c signify-openbsd
          bash scripts/index.sh work site
          find site -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error

  # Installs from the built site exactly as a user would, with the site served
  # by scripts/serve.py: it applies the generated _redirects as Pages would, so
  # every package really is fetched from GitHub through a 302.
  test:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    timeout-minutes: 20
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:stable", arch: amd64 }
          - { image: "debian:stable", arch: arm64 }
          - { image: "ubuntu:22.04", arch: amd64 }
          - { image: "ubuntu:24.04", arch: amd64 }
          - { image: "fedora:latest", arch: amd64 }
          - { image: "fedora:latest", arch: arm64 }
          - { image: "rockylinux:9", arch: amd64 }
          - { image: "alpine:3.21", arch: amd64 }
          - { image: "alpine:3.24", arch: amd64 }
          - { image: "alpine:3.24", arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Install saki and nermius from the site
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve.py site 8080 > server.log 2>&1 &
          sleep 1
          status=0
          docker run --rm --network host -e BASE=http://127.0.0.1:8080 -e APK_KEY="$(cat site/keys/apk-key-name)" \
            "${{ matrix.image }}" sh -euc '
              if command -v apt-get >/dev/null; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
                curl -fsSLo /usr/share/keyrings/nemo.gpg "$BASE/keys/nemo-packages.gpg"
                echo "deb [signed-by=/usr/share/keyrings/nemo.gpg] $BASE/apt nightly main" > /etc/apt/sources.list.d/nemo.list
                apt-get update -qq
                apt-get install -y saki nermius nemosh gp-socks
              elif command -v dnf >/dev/null; then
                curl -fsSLo /etc/yum.repos.d/nemo-nightly.repo "$BASE/rpm/nemo-nightly.repo"
                sed -i "s|^baseurl=.*|baseurl=$BASE/rpm/nightly|; s|^gpgkey=.*|gpgkey=$BASE/keys/nemo-packages.asc|" /etc/yum.repos.d/nemo-nightly.repo
                dnf install -y saki nermius nemosh gp-socks
              else
                wget -qO "/etc/apk/keys/$APK_KEY" "$BASE/keys/$APK_KEY"
                echo "$BASE/apk/nightly" >> /etc/apk/repositories
                apk update
                apk add saki nermius nemosh gp-socks
              fi
              saki --version
              nermius version
              nemosh --version
              gp-socks --help 2>&1 | grep -q "Usage of gp-socks"
            ' || status=$?
          echo "== requests"
          cat server.log
          exit $status

  # MacPorts gets the same check on both Mac architectures: install MacPorts,
  # add the site's key and tree as the landing page says, sync (which verifies
  # the tarball's signature) and install every port from it.
  test-macports:
    name: MacPorts install on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install-macports.sh

      - name: Install the ports from the site
        run: |
          set -euo pipefail
          python3 scripts/serve.py site 8080 > server.log 2>&1 &
          sleep 1
          status=0
          bash scripts/test-macports.sh http://127.0.0.1:8080 || status=$?
          echo "== requests"
          cat server.log
          exit $status

  # Scoop is not indexed here: the bucket is its own repository, and its
  # Excavator hashes the published archive itself. What this adds is the
  # dispatch: a release announced here is announced to the bucket too, so a
  # project only has to notify one place. It runs beside the index build, not
  # after it, so a broken index never holds Scoop back.
  #
  # It waits until GitHub's releases *list* shows a Windows asset of the release,
  # because the bucket's checkver reads that list, and on 2026-09-23 the list
  # lagged a finished upload by hours: a dispatch sent before then packages
  # nothing and still reports success.
  scoop:
    name: Tell the Scoop bucket
    if: github.event_name == 'repository_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch the bucket's Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.client_payload.repository }}
          TAG: ${{ github.event.client_payload.tag }}
          BUCKET: ${{ vars.SCOOP_BUCKET || 'xiongnemo/windows-binaries-scoop-bucket' }}
        run: |
          set -euo pipefail
          if ! jq -e --arg repo "$REPO" '.projects[] | select(.repo == $repo and .scoop == true)' projects.json >/dev/null; then
            echo "${REPO} has no Scoop manifest; nothing to tell the bucket."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice title=Scoop not notified::SCOOP_BUCKET_TOKEN is not set; the bucket's hourly sweep will pick ${TAG} up."
            exit 0
          fi
          visible=false
          for attempt in $(seq 1 20); do
            if GH_TOKEN="$READ_TOKEN" gh api "repos/${REPO}/releases?per_page=10" \
                --jq ".[] | select(.tag_name == \"${TAG}\") | .assets[].name" | grep -qi windows; then
              visible=true
              echo "the releases list shows ${TAG}'s Windows asset (check ${attempt})"
              break
            fi
            sleep 15
          done
          if [ "$visible" != true ]; then
            echo "::warning title=The Scoop bucket may lag this release::the releases list does not show a Windows asset of ${REPO} ${TAG} yet; dispatching anyway, and the hourly sweep is the backstop."
          fi
          gh workflow run excavator.yml --repo "$BUCKET"
          echo "dispatched ${BUCKET} for ${REPO} ${TAG}"

  # Deploying is publishing the `site` branch: the Worker in worker/ serves
  # whatever commit that branch points at, re-resolving it every minute, so a
  # push is live within a minute and nothing here holds a Cloudflare token.
  deploy:
    name: Deploy
    needs: [test, test-macports]
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish the site branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f site/TEST-ONLY ]; then
            echo "::notice title=Not deployed::the site was signed with throwaway keys; set GPG_SIGNING_KEY, APK_SIGNING_KEY and APK_SIGNING_KEY_NAME."
            exit 0
          fi
          cd site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site:site
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "site branch: $(git rev-parse HEAD)"

  # Installs from the public URL once it serves the commit just published --
  # the check that the Worker, the signatures and GitHub's redirects work
  # together, not just a local stand-in for them.
  verify-live:
    name: Live install on ${{ matrix.image }}
    needs: deploy
    timeout-minutes: 15
    if: needs.deploy.outputs.commit != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "fedora:latest", "alpine:3.24"]
    env:
      BASE: ${{ vars.SITE_URL }}
      COMMIT: ${{ needs.deploy.outputs.commit }}
    steps:
      - name: Wait for the site to serve this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            served=$(curl -fsSI --max-time 20 "$BASE/" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "x-site-commit" { print $2 }' || true)
            [ "$served" = "$COMMIT" ] && { echo "serving $COMMIT (check $attempt)"; exit 0; }
            sleep 10
          done
          echo "::error::$BASE still serves ${served:-nothing}, not $COMMIT"
          exit 1

      - name: Install saki and nermius from the live site
        run: |
          set -euo pipefail
          docker run --rm -e BASE "${{ matrix.image }}" sh -euc '
            if command -v apt-get >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
              curl -fsSLo /usr/share/keyrings/nemo.gpg "$BASE/keys/nemo-packages.gpg"
              echo "deb [signed-by=/usr/share/keyrings/nemo.gpg] $BASE/apt nightly main" > /etc/apt/sources.list.d/nemo.list
              apt-get update -qq
              apt-get install -y saki nermius nemosh gp-socks
            elif command -v dnf >/dev/null; then
              curl -fsSLo /etc/yum.repos.d/nemo-nightly.repo "$BASE/rpm/nemo-nightly.repo"
              dnf install -y saki nermius nemosh gp-socks
            else
              key=$(wget -qO- "$BASE/keys/apk-key-name")
              wget -qO "/etc/apk/keys/$key" "$BASE/keys/$key"
              echo "$BASE/apk/nightly" >> /etc/apk/repositories
              apk update
              apk add saki nermius nemosh gp-socks
            fi
            saki --version
            nermius version
            nemosh --version
            gp-socks --help 2>&1 | grep -q "Usage of gp-socks"
          '

  live-macports:
    name: Live MacPorts install on macos-latest
    needs: deploy
    if: needs.deploy.outputs.commit != ''
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BASE: ${{ vars.SITE_URL }}
      COMMIT: ${{ needs.deploy.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the site to serve this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            served=$(curl -fsSI --max-time 20 "$BASE/" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "x-site-commit" { print $2 }' || true)
            [ "$served" = "$COMMIT" ] && { echo "serving $COMMIT (check $attempt)"; exit 0; }
            sleep 10
          done
          echo "::error::$BASE still serves ${served:-nothing}, not $COMMIT"
          exit 1

      - name: Install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install-macports.sh

      - name: Install the ports from the live site
        run: bash scripts/test-macports.sh "$BASE"
