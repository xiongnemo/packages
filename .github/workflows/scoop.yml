name: Scoop

# Scoop is not indexed here: the bucket is its own repository, and its
# Excavator hashes the published archive itself. What this adds is the
# dispatch: a release announced here is announced to the bucket too, so a
# project only has to notify one place.
#
# It is its own workflow, outside Publish's concurrency group, because GitHub
# keeps one pending run per group and cancels it when another queues: two
# releases dispatched a minute apart lost the first one's Scoop dispatch with
# its Publish run (2026-11-18). Publish loses nothing that way, as every run
# rebuilds every index, but the bucket was only told about the second release.
# Each run here only reads and dispatches, so runs never need to wait for each
# other.
#
# It waits until GitHub's releases *list* shows the release's windows/amd64
# asset, because the bucket's checkver reads that list, and on 2026-09-23 the
# list lagged a finished upload by hours: a dispatch sent before then packages
# nothing and still reports success. Every project the bucket carries builds
# windows/amd64 (spelled windows-amd64 or windows_amd64), and most nightly
# checkvers look for exactly that asset, so another Windows asset showing
# first (nemosh's 386 sorts before amd64) is not enough.

on:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

jobs:
  scoop:
    name: Tell the Scoop bucket
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch the bucket's Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.client_payload.repository }}
          TAG: ${{ github.event.client_payload.tag }}
          BUCKET: ${{ vars.SCOOP_BUCKET || 'xiongnemo/windows-binaries-scoop-bucket' }}
        run: |
          set -euo pipefail
          if ! jq -e --arg repo "$REPO" '.projects[] | select(.repo == $repo and .scoop == true)' projects.json >/dev/null; then
            echo "${REPO} has no Scoop manifest; nothing to tell the bucket."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice title=Scoop not notified::SCOOP_BUCKET_TOKEN is not set; the bucket's hourly sweep will pick ${TAG} up."
            exit 0
          fi
          visible=false
          for attempt in $(seq 1 20); do
            if GH_TOKEN="$READ_TOKEN" gh api "repos/${REPO}/releases?per_page=10" \
                --jq ".[] | select(.tag_name == \"${TAG}\") | .assets[].name" | grep -qiE 'windows[-_]amd64'; then
              visible=true
              echo "the releases list shows ${TAG}'s windows/amd64 asset (check ${attempt})"
              break
            fi
            sleep 15
          done
          if [ "$visible" != true ]; then
            echo "::warning title=The Scoop bucket may lag this release::the releases list does not show a Windows asset of ${REPO} ${TAG} yet; dispatching anyway, and the hourly sweep is the backstop."
          fi
          gh workflow run excavator.yml --repo "$BUCKET"
          echo "dispatched ${BUCKET} for ${REPO} ${TAG}"
