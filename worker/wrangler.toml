# The Worker that serves https://xiongnemo-packages.anzupop.workers.dev from the
# `site` branch. It only needs redeploying when index.js changes; new sites go
# live by being pushed to the branch.  `npx wrangler deploy` from this directory.
name = "xiongnemo-packages"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true
